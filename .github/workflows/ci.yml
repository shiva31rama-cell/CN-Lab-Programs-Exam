name: Validate CN Lab CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test CLI
        run: npm test

      - name: Check Python syntax
        run: python -m compileall -q programs/python

      - name: Check npm package contents and size
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/npm-pack.json"
          node -e "const p=require(process.argv[1])[0]; console.log('npm package: '+p.filename); console.log('unpacked size: '+p.unpackedSize+' bytes'); console.log('compressed size: '+p.size+' bytes'); if (p.size > 100000) process.exit(1);" "$RUNNER_TEMP/npm-pack.json"

      - name: Compile Java practicals
        run: |
          mkdir -p "$RUNNER_TEMP/cn-lab-classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/cn-lab-classes" programs/java/*.java
