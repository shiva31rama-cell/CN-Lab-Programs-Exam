name: Validate CN Lab CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test CLI
        run: npm test

      - name: Check Python syntax
        run: python -m compileall -q programs/python

      - name: Compile Java practicals
        run: |
          mkdir -p "$RUNNER_TEMP/cn-lab-classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/cn-lab-classes" programs/java/*.java
